name: MossGodot Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Release Build - ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x86_64
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: macos-14
            platform: macos-universal

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DGODOTCPP_API_VERSION=4.7 `
            -DGODOTCPP_TARGET=template_release

      - name: Configure Linux
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGODOTCPP_API_VERSION=4.7 \
            -DGODOTCPP_TARGET=template_release

      - name: Configure macOS
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DGODOTCPP_API_VERSION=4.7 \
            -DGODOTCPP_TARGET=template_release

      - name: Build release extension
        run: cmake --build build --config Release --parallel 2

      - name: Upload platform binary
        uses: actions/upload-artifact@v4
        with:
          name: MossGodot-${{ matrix.platform }}
          path: addons/moss_godot/bin/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download platform binaries
        uses: actions/download-artifact@v4
        with:
          pattern: MossGodot-*
          path: release/addons/moss_godot/bin
          merge-multiple: true

      - name: Prepare package
        run: |
          mkdir -p release/addons/moss_godot
          cp addons/moss_godot/moss_godot.gdextension release/addons/moss_godot/
          cp addons/moss_godot/plugin.cfg release/addons/moss_godot/
          cp addons/moss_godot/plugin.gd release/addons/moss_godot/
          cp README.md LICENSE VERSION release/
          cp -R docs release/
          zip -r MossGodot-${GITHUB_REF_NAME}.zip release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: MossGodot-${{ github.ref_name }}.zip
          fail_on_unmatched_files: true
