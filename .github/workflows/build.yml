name: Build

on:
  push:
    branches:
      - main
      - master
    paths:
      - "src/**"
      - "addons/**"
      - "demo/**"
      - "CMakeLists.txt"
      - "project.godot"
      - ".github/workflows/build.yml"

  pull_request:
    paths:
      - "src/**"
      - "addons/**"
      - "demo/**"
      - "CMakeLists.txt"
      - "project.godot"
      - ".github/workflows/build.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mossgodot-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build - ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - os: windows-2022
            platform: Windows x86_64
            target: template_debug

          - os: ubuntu-24.04
            platform: Linux x86_64
            target: template_debug

          - os: macos-14
            platform: macOS universal
            target: template_debug

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DGODOTCPP_API_VERSION=4.7 `
            -DGODOTCPP_TARGET=${{ matrix.target }} `
            -DGODOTCPP_PRECISION=single

      - name: Configure Linux
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DGODOTCPP_API_VERSION=4.7 \
            -DGODOTCPP_TARGET=${{ matrix.target }} \
            -DGODOTCPP_PRECISION=single

      - name: Configure macOS
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DGODOTCPP_API_VERSION=4.7 \
            -DGODOTCPP_TARGET=${{ matrix.target }} \
            -DGODOTCPP_PRECISION=single

      - name: Build extension
        run: cmake --build build --config Debug --parallel 2

      - name: Verify generated extension
        shell: bash
        run: |
          find addons/moss_godot/bin -maxdepth 1 -type f
          test -n "$(find addons/moss_godot/bin -maxdepth 1 -type f)"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: MossGodot-Debug-${{ matrix.platform }}
          path: addons/moss_godot/bin/*
          if-no-files-found: error
          retention-days: 14
